spring.application.name=java-spring-boot-back-end-app

# Point to .env file at root
spring.config.import=optional:file:.env[.properties]

# Database connection
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Let Hibernate build the tables from your entities
spring.jpa.hibernate.ddl-auto=update